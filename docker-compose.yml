services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: letsgo
      POSTGRES_USER: letsgo
      POSTGRES_PASSWORD: letsgo
    ports:
      - "5432:5432"
    volumes:
      - letsgo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letsgo -d letsgo"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - letsgo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  letsgo_postgres:
  letsgo_redis:
